name: Deploy dashboard preview to GitHub Pages

# Publishes the dashboard (simulation mode — no backend needed) as a public
# website you can open on any device, including a phone.

on:
  push:
    branches: ["claude/great-pasteur-maa3c7"]
    paths: ["dashboard/**", ".github/workflows/deploy-dashboard.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: dashboard
        env:
          # The web build doesn't need the Electron binary — skip the big download.
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm install --no-audit --no-fund
      - name: Build
        working-directory: dashboard
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
