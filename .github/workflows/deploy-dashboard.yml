name: Deploy dashboard preview to GitHub Pages

# Builds the dashboard (simulation mode — no backend needed) and publishes it to
# a `gh-pages` branch, which GitHub Pages can serve as a public website you can
# open on any device, including a phone.

on:
  push:
    branches: ["claude/great-pasteur-maa3c7"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: dashboard
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm install --no-audit --no-fund
      - name: Build
        working-directory: dashboard
        run: npm run build
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dashboard/dist
          publish_branch: gh-pages
          force_orphan: true
